# Nombre del flujo de trabajo
name: CI - Build, Test and Coverage

# Disparadores del flujo de trabajo (se ejecuta en cualquier push o pull request)
on:
  push:
  pull_request:

jobs:
  # ----- TRABAJO PARA EL BACKEND -----
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTPOSTGRES_USER: reservas_user
          POSTGRES_PASSWORD: p4ssw0rd_s3gUr4_2025!
          POSTGRES_DB: reservas_db
        options: >-
          --health-cmd "pg_isready -U reservas_user -d reservas_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'sistema-reservas/backend/package-lock.json'

      - name: Install backend dependencies
        working-directory: ./sistema-reservas/backend
        run: npm ci

      - name: Run Prisma migrations and tests
        working-directory: ./sistema-reservas/backend
        env:
          DATABASE_URL: "postgresql://reservas_user:p4ssw0rd_s3gUr4_2025!@localhost:5432/reservas_db"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "test-secret-key-for-ci"
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run coverage

      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend

  # ----- TRABAJO PARA EL FRONTEND -----
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'sistema-reservas/frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: ./sistema-reservas/frontend
        run: npm ci

      - name: Run frontend tests and coverage
        working-directory: ./sistema-reservas/frontend
        run: npm test -- --coverage
      
      - name: Build frontend project
        working-directory: ./sistema-reservas/frontend
        run: npm run build

      - name: Upload Frontend Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: frontend