name: CI - Tests and Coverage

on:
  push:
  pull_request:

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sistema-reservas/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./sistema-reservas/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload Frontend Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: frontend
          fail_ci_if_error: true

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sistema-reservas/backend # Este es el directorio de trabajo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker network and services
        run: |
          docker network create backend_network
          
          docker run --name postgres_service -d --network backend_network \
          -e POSTGRES_USER=reservas_user \
          -e POSTGRES_PASSWORD=p4ssw0rd_s3gUr4_2025! \
          -e POSTGRES_DB=reservas_db_test \
          postgres:15-alpine
          
          docker run --name redis_service -d --network backend_network redis:alpine
          
          echo "Waiting for PostgreSQL to be ready..."
          until docker exec postgres_service pg_isready --host=localhost --username="reservas_user" -p 5432; do
            sleep 1
          done
          echo "PostgreSQL is ready!"
          
          echo "DATABASE_URL=postgresql://reservas_user:p4ssw0rd_s3gUr4_2025!@postgres_service:5432/reservas_db_test" >> $GITHUB_ENV
          echo "REDIS_URL=redis://redis_service:6379" >> $GITHUB_ENV

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./sistema-reservas/backend/package-lock.json
      
      - name: Verify Node.js versions
        run: |
          echo "Verifying Node.js and npm versions..."
          node -v
          npm -v
        
      - name: Install dependencies
        run: |
          rm -f package-lock.json # Se busca en el working-directory
          npm install --ignore-scripts
      
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma # Se busca en el working-directory
      
      - name: Apply Migrations
        run: npx prisma migrate deploy --schema prisma/schema.prisma # Se busca en el working-directory

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend
          fail_ci_if_error: true
          
      - name: Clean up Docker containers
        if: always()
        run: docker rm -f postgres_service redis_service