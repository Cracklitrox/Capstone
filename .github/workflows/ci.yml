name: CI - Tests and Coverage

on:
  push:
  pull_request:

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: backend
            node: 20
            lockfile: sistema-reservas/backend/package-lock.json
          - project: frontend
            node: 20
            lockfile: sistema-reservas/frontend/package-lock.json
    defaults:
      run:
        working-directory: ./${{ matrix.project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          # token: ${{ secrets.CODECOV_TOKEN }} Dejar comentado ya que no es necesario para repositorios públicos
          directory: ./${{ matrix.project }}/coverage
          fail_ci_if_error: true
          verbose: true
