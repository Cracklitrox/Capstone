name: CI - Tests and Coverage

on:
  push:
  pull_request:

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend]

    defaults:
      run:
        working-directory: ./sistema-reservas/${{ matrix.project }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: reservas_user
          POSTGRES_PASSWORD: p4ssw0rd_s3gUr4_2025!
          POSTGRES_DB: reservas_db_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./sistema-reservas/${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run backend pipeline
        if: ${{ matrix.project == 'backend' }}
        run: |
          # Espera explícita a que PostgreSQL esté listo
          echo "Waiting for Postgres to be ready..."
          /usr/bin/timeout 60s bash -c 'until pg_isready --dbname="reservas_db_test" --host="postgres" --username="reservas_user"; do sleep 1; done'
          
          # Genera el cliente de Prisma y ejecuta las migraciones
          npx prisma generate
          npx prisma migrate deploy
          
          # Ejecuta las pruebas
          npm run coverage
        env:
          DATABASE_URL: "postgresql://reservas_user:p4ssw0rd_s3gUr4_2025!@postgres:5432/reservas_db_test"
          REDIS_URL: "redis://redis:6379"
          JWT_SECRET: "test-secret-key-for-ci"

      - name: Run frontend tests
        if: ${{ matrix.project == 'frontend' }}
        run: npm run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.project }}
          fail_ci_if_error: true