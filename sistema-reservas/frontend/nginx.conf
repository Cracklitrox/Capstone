
upstream backend_api_service {
  server backend:3001;
}

server {
  # Nginx escuchará en el puerto 80 dentro del contenedor.
  listen 80;

  # PRIMERA REGLA: Proxy para la API
  # Si la URL que recibe Nginx empieza con '/api', aplicará esta regla.
  location /api {
    proxy_pass http://backend_api_service;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SEGUNDA REGLA: Servir la aplicación de React
  # Esta regla se aplicará a CUALQUIER OTRA URL que no empiece con /api.
  location / {
    root   /usr/share/nginx/html;
    index  index.html;
    try_files $uri /index.html;
  }
}