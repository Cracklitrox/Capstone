name: CI - Test and Coverage with Services

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: reservas_user
          POSTGRES_PASSWORD: p4ssw0rd_s3gUr4_2025!
          POSTGRES_DB: reservas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservas_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./sistema-reservas/backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./sistema-reservas/backend

      - name: Set up environment variables
        run: |
          echo "DATABASE_URL=postgresql://reservas_user:p4ssw0rd_s3gUr4_2025!@localhost:5432/reservas_db" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV
        working-directory: ./sistema-reservas/backend

      - name: Run backend tests with coverage
        run: npm test
        working-directory: ./sistema-reservas/backend
        env:
          DATABASE_URL: postgresql://reservas_user:p4ssw0rd_s3gUr4_2025!@localhost:5432/reservas_db
          REDIS_URL: redis://localhost:6379

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./sistema-reservas/backend/coverage/lcov.info
          fail_ci_if_error: true
          verbose: true
      

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./sistema-reservas/frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./sistema-reservas/frontend

      - name: Run frontend tests
        run: npm test
        working-directory: ./sistema-reservas/frontend