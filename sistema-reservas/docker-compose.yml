name: CI - Tests and Coverage

on:
  push:
  pull_request:

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: backend
            node: 20
            lockfile: sistema-reservas/backend/package-lock.json
          - project: frontend
            node: 20
            lockfile: sistema-reservas/frontend/package-lock.json
    defaults:
      run:
        working-directory: ./sistema-reservas/${{ matrix.project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./sistema-reservas/${{ matrix.project }}/coverage/lcov.info
          fail_ci_if_error: true
          verbose: true

      - name: List coverage files
        run: ls -R ./sistema-reservas/${{ matrix.project }}/coverage || echo "No coverage files"

  backend-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15-alpine
        container_name: db_postgres
        restart: always
        environment:
          POSTGRES_USER: reservas_user
          POSTGRES_PASSWORD: ReservasDevPass_2025
          POSTGRES_DB: reservas_db
        ports:
          - "5433:5432"
        volumes:
          - pgdata:/var/lib/postgresql/data
          - ./sistema-reservas/backend/docker-entrypoint.sh:/docker-entrypoint-initdb.d/docker-entrypoint.sh
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U reservas_user -d reservas_db"]
          interval: 10s
          timeout: 10s
          retries: 10

      redis:
        image: redis:alpine
        container_name: redis_cache
        restart: always
        ports:
          - "6379:6379"
        volumes:
          - redisdata:/data

    env:
      PGPASSWORD: ReservasDevPass_2025
      DATABASE_URL: "postgresql://reservas_user:ReservasDevPass_2025@db:5432/reservas_db"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "test-secret-key-for-ci"
      JWT_EXPIRES_IN: "1d"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./sistema-reservas/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --ignore-scripts
        working-directory: ./sistema-reservas/backend

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready --host=postgres --port=5432 --dbname=reservas_db --username=reservas_user; do
            echo "Waiting for PostgreSQL database to be ready..."
            docker logs $(docker ps -q -f "ancestor=postgres:15-alpine") # Imprime los logs de PostgreSQL mientras espera
            sleep 5
          done

      - name: Run Prisma and Tests
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run coverage
        working-directory: ./sistema-reservas/backend
        env:
          REDIS_URL: "redis://redis:6379"
          JWT_SECRET: "test-secret-key-for-ci"

      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend
          fail_ci_if_error: true

volumes:
  pgdata:
    name: sistema-reservas-pgdata
  redisdata:
    name: sistema-reservas-redisdata
