# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Permite cualquier conexión local (dentro del contenedor) sin contraseña.
# Esto es seguro en Docker y es NECESARIO para el script de inicio.
local   all             all                                     trust

# Permite que cualquier usuario se conecte desde dentro del contenedor vía TCP/IP.
host    all             all             127.0.0.1/32            trust

# Permite al usuario de la aplicación conectarse desde cualquier IP (otro contenedor o tu PC).
# Cambiamos 'reservas_db' por 'all' para que el healthcheck y otras herramientas puedan funcionar.
host    all             reservas_user   0.0.0.0/0               md5
host    all             reservas_user   ::/0                    md5